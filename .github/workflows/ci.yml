name: Quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Behavioral and API contract tests
        run: python -m unittest discover -s tests -v
      - name: Block evaluation regressions
        run: python -m modelforge eval
      - name: Generate reproducible evidence
        run: python -m modelforge demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-python-${{ matrix.python-version }}
          path: runs/
